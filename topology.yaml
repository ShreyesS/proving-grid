# Single source of truth for the proving-grid digital twin.
# Nodes: identity, role, services, modeled vulns (simulation only).
# Edges: trust / reachability for lateral movement and defender isolation.
#
# Depth layered on top of the base topology (meaningful branching):
#   zone:         kill-chain segment (external -> edge -> dmz -> corp) for layout + cross-zone detection.
#   criticality:  0-100, how much live service is lost if the defender isolates the node
#                 (feeds costed containment + mission_integrity in the defender milestone).
#   loot:         credentials/data an attacker collects; a credential can unlock a gated edge.
#   requires_cred (edges): a shortcut edge that only opens once its credential is looted.
#
# Routes to the crown jewel (db_server), best first:
#   A (best):  internet -> cdn_edge -> load_balancer -> app_server -> db_server
#              app_server holds `db_service_cred`, which unlocks the gated app_server->db_server
#              hop. Fewest hops, the cred is right where you land. "that's the whole vuln."
#   B (alt):   internet -> cdn_edge -> load_balancer -> cache_server -> db_server   (low trust)
#   C (corp):  internet -> cdn_edge -> corp_vpn -> corp_resources -> db_server      (longer)
#   Dead-end:  workstation -> dev_laptop  (loot, but NO route onward to db_server)
#   Decoy:     staging_decoy advertises an RCE but is fully patched -> exploit always fails.

mission:
  goal: exfiltrate customer database
  critical_nodes:
    - db_server

nodes:
  - id: internet
    type: external
    zone: external
    criticality: 0
    services: []
    modeled_vulns: []
    defender_monitor: false
    mission_critical: false

  - id: cdn_edge
    type: cdn_edge
    zone: edge
    criticality: 70
    services:
      - nginx
      - tls_termination
      - origin_pull
    modeled_vulns:
      - id: EDGE-ORIGIN-SSRF
        technique: initial_access
        cvss: 9.1
        epss: 0.85
        description: SSRF via misconfigured origin fetch allows pivot to internal origins
      - id: EDGE-CACHE-POISON
        technique: initial_access
        cvss: 7.5
        epss: 0.4
        description: Cache key confusion enables serving attacker-controlled responses
    defender_monitor: true
    mission_critical: false

  - id: load_balancer
    type: load_balancer
    zone: edge
    criticality: 85          # customer-facing traffic — costly to isolate
    services:
      - haproxy
      - health_checks
    modeled_vulns:
      - id: LB-ADMIN-EXPOSED
        technique: initial_access
        cvss: 8.6
        epss: 0.7
        description: Staging admin API reachable from compromised edge tier
    defender_monitor: true
    mission_critical: false

  - id: staging_decoy
    type: staging
    zone: edge
    criticality: 10
    services:
      - jenkins
      - test_harness
    modeled_vulns:
      # LOOKS exploitable but isn't: advertised RCE, host is fully patched -> exploit fails.
      - id: STAGING-RCE
        technique: initial_access
        cvss: 9.8
        epss: 0.9
        description: Advertised RCE in staging build server — host is fully patched (exploit fails)
        patched: true
    defender_monitor: true
    mission_critical: false

  - id: firewall
    type: firewall
    zone: dmz
    criticality: 90          # isolating this cuts the entire corp zone off
    services:
      - stateful_inspection
      - zone_segmentation
    modeled_vulns:
      - id: FW-POLICY-DRIFT
        technique: defense_evasion
        cvss: 7.2
        epss: 0.5
        description: Overly permissive rule allows DMZ-to-corp traffic on non-standard port
    defender_monitor: true
    mission_critical: false

  - id: cloud_vpc
    type: cloud_vpc
    zone: edge
    criticality: 65
    services:
      - aws_vpc
      - s3_bucket
      - iam_roles
    modeled_vulns:
      - id: VPC-IAM-OVERPRIV
        technique: privilege_escalation
        cvss: 8.1
        epss: 0.55
        description: Overpermissioned IAM role allows cross-account S3 read
    defender_monitor: true
    mission_critical: false

  - id: app_server
    type: app_server
    zone: dmz
    criticality: 80          # customer web/API tier
    services:
      - api_gateway
      - auth_service
    modeled_vulns:
      - id: APP-IDOR
        technique: privilege_escalation
        cvss: 6.5
        epss: 0.45
        description: Broken object-level authorization on customer records API
      - id: APP-DESER
        technique: privilege_escalation
        cvss: 8.8
        epss: 0.75
        description: Unsafe deserialization in session blob parser
    loot:
      # The shortcut credential: unlocks the gated app_server -> db_server hop.
      - id: db_service_cred
        type: credential
        description: Reused service-account credential with SELECT on customer PII
        unlocks_edge: [app_server, db_server]
    defender_monitor: true
    mission_critical: false

  - id: cache_server
    type: cache_server
    zone: dmz
    criticality: 60
    services:
      - redis
      - session_store
    modeled_vulns:
      - id: CACHE-UNAUTH
        technique: lateral_movement
        cvss: 9.0
        epss: 0.8
        description: Redis instance lacks AUTH from app subnet
    defender_monitor: true
    mission_critical: false

  - id: corp_vpn
    type: firewall
    zone: dmz
    criticality: 75
    services:
      - vpn_gateway
      - split_tunnel
    modeled_vulns:
      - id: VPN-MFA-BYPASS
        technique: initial_access
        cvss: 8.2
        epss: 0.6
        description: Legacy VPN profile without MFA for contractor accounts
    defender_monitor: true
    mission_critical: false

  - id: workstation
    type: workstation
    zone: corp
    criticality: 30
    services:
      - email_client
      - browser
    modeled_vulns:
      - id: WS-PHISH
        technique: initial_access
        cvss: 7.8
        epss: 0.65
        description: Simulated phishing leads to user session token theft
    defender_monitor: true
    mission_critical: false

  - id: corp_resources
    type: corp_resources
    zone: corp
    criticality: 70
    services:
      - admin_console
      - deployment_pipeline
      - shared_drives
    modeled_vulns:
      - id: CORP-CI-TOKEN
        technique: lateral_movement
        cvss: 8.0
        epss: 0.5
        description: CI deploy token stored in local credential manager (modeled)
    defender_monitor: true
    mission_critical: false

  - id: dev_laptop
    type: workstation
    zone: corp
    criticality: 20
    services:
      - ide
      - git_client
    modeled_vulns:
      - id: DEV-RCE
        technique: lateral_movement
        cvss: 7.0
        epss: 0.3
        description: Outdated IDE plugin allows code execution from a malicious repo
    loot:
      # Tempting but useless: no edge leads onward from here, and it isn't the goal.
      - id: stale_repo
        type: data
        description: Months-old source mirror — no route onward, no mission value (decoy)
    defender_monitor: false
    mission_critical: false

  - id: db_server
    type: db_server
    zone: corp
    criticality: 100         # crown jewel
    services:
      - postgresql
      - customer_db
    modeled_vulns:
      - id: DB-CRED-REUSE
        technique: credential_access
        cvss: 8.8
        epss: 0.6
        description: Application service account has SELECT on customer PII tables
      - id: DB-BACKUP-EXPORT
        technique: exfiltration
        cvss: 7.5
        epss: 0.4
        description: Nightly backup job can be triggered to attacker-controlled bucket (modeled)
    loot:
      - id: customer_db
        type: data
        description: Customer database dump (mission objective)
    defender_monitor: true
    mission_critical: true

edges:
  - source: internet
    target: cdn_edge
    trust: low # CDN accepts but doesn't trust public traffic

  - source: cdn_edge
    target: load_balancer
    trust: low

  - source: cdn_edge
    target: staging_decoy
    trust: low # reachable from the edge, but a patched dead-end

  - source: load_balancer
    target: firewall
    trust: low

  - source: firewall
    target: app_server
    trust: medium

  - source: firewall
    target: corp_resources
    trust: medium

  - source: cdn_edge
    target: cloud_vpc
    trust: low

  - source: cloud_vpc
    target: db_server
    trust: medium         # cloud path: VPC peering into the data tier

  - source: load_balancer
    target: cache_server
    trust: medium

  - source: app_server
    target: db_server
    trust: high # service account cred reuse — that's the whole vuln
    requires_cred: db_service_cred # shortcut hop, opens once db_service_cred is looted

  - source: cache_server
    target: db_server
    trust: low

  - source: cdn_edge
    target: corp_vpn
    trust: low

  - source: corp_vpn
    target: workstation
    trust: medium

  - source: corp_vpn
    target: corp_resources
    trust: medium

  - source: workstation
    target: corp_resources
    trust: high

  - source: workstation
    target: dev_laptop
    trust: medium # inbound only: dev_laptop has no edge onward (dead-end)

  - source: corp_resources
    target: db_server
    trust: high # corporate path to crown jewel
